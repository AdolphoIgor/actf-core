[project]
name = "1-raw-data-ingest"
version = "0.1.0"
description = "Raw Data Ingestion Phase: Spark JDBC & Ray Document Pipeline"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2.0",
    "pyspark==3.5.4",
    "ray[default,data]==2.40.0",
    "boto3>=1.34.0",
    "botocore>=1.34.0",
    "pyarrow>=15.0.0",
    "s3fs>=2024.3.0",
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
# Automatically adds these directories to sys.path during test collection
pythonpath = ["spark", "."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".git", ".venv", "__pycache__", "build", "dist"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "F",  # pyflakes
    "I",  # isort
    "UP", # pyupgrade
    "B",  # flake8-bugbear
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
