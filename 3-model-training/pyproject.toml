[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "3-model-training"
version = "0.1.0"
description = "ACTF Continuous Model Training Engine: Steps 11 to 14"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2.0",
    "transformers>=4.40.0",
    "accelerate>=0.29.0",
    "safetensors>=0.4.2",
    "numpy>=1.26.0",
    "pyarrow>=15.0.0",
    "scipy>=1.12.0",
    "pydantic>=2.6.0",
]

[project.optional-dependencies]
cpu = []
gpu = [
    "vllm>=0.4.0",
    "flash-attn>=2.5.0; sys_platform == 'linux'",
    "triton>=2.2.0; sys_platform == 'linux'",
]
test = ["pytest>=8.0.0", "pytest-cov>=4.1.0", "pytest-mock>=3.12.0"]
dev = ["3-model-training[test]", "ruff>=0.3.0", "mypy>=1.9.0"]

[tool.hatch.build.targets.wheel]
packages = ["scripts"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".git", ".venv", "__pycache__", "build", "dist"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "F",  # pyflakes
    "I",  # isort
    "UP", # pyupgrade
    "B",  # flake8-bugbear
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
